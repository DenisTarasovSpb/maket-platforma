<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Макет экосистемы v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
/* Макет для просмотра: один файл, без сборки. Тексты и цифры - заглушки. */
:root{
  --bg:#f2f4f1; --surface:#fcfdfb; --surface-2:#e9ede8; --ink:#13201b; --muted:#56635d; --faint:#87928c;
  --line:rgba(19,32,27,.10); --line-strong:rgba(19,32,27,.20);
  --accent:#0e6b50; --accent-hover:#0b5a43; --on-accent:#f2fbf6; --accent-soft:#dcefe5; --accent-ink:#0a4a37;
  --tool:var(--surface-2); --on-tool:var(--ink); --tool-line:var(--line-strong);
  --page:var(--bg); --btn-bg:var(--accent); --btn-bg-hover:var(--accent-hover);
  --r-card:16px; --r-ctl:10px; --panel-w:400px;
  --shadow:0 1px 2px rgba(19,32,27,.05),0 12px 32px rgba(19,32,27,.10);
  --ease:cubic-bezier(.16,1,.3,1);
  /* детали, которые в разных оформлениях красятся по-разному */
  --mark:var(--accent); --phone:#c9d1cc; --ask-line:var(--accent); --tint-p:var(--accent-ink);
  --core-bg:var(--accent); --core-fg:var(--on-accent); --core-line:transparent;
  --core-pill-bg:color-mix(in srgb,var(--on-accent) 16%,transparent); --core-pill-fg:var(--on-accent);
  --core-cta-bg:var(--on-accent); --core-cta-fg:var(--accent);
  --core-qr-bg:var(--on-accent); --core-qr-fg:var(--accent); --core-qr-line:transparent;
}
/* Оформления. Базовое (:root) - "Изумруд". Правило Дениса: только светлые, без чёрного фона и чёрных блоков. */
[data-skin="pearl"]{
  --page:linear-gradient(165deg,#fcf9f3 0%,#f4eee2 55%,#ece2d0 100%);
  --bg:#f8f3e9; --surface:#fffdf8; --surface-2:#efe7d8; --ink:#3a3226; --muted:#6f6555; --faint:#9a907f;
  --line:rgba(58,50,38,.10); --line-strong:rgba(58,50,38,.20);
  --accent:#b8934a; --accent-hover:#a88440; --on-accent:#33270f; --accent-soft:#f1e6cc; --accent-ink:#8a6a2c;
  --btn-bg:linear-gradient(135deg,#dcc083,#b8934a); --btn-bg-hover:linear-gradient(135deg,#d2b472,#a88440);
  --shadow:0 1px 2px rgba(58,50,38,.05),0 12px 32px rgba(58,50,38,.10);
  --phone:#d9cdb6; --tint-p:var(--muted);
  --core-bg:linear-gradient(140deg,#f6ebcd 0%,#e2c98f 58%,#cfae69 100%); --core-fg:#3a2c10; --core-line:rgba(184,147,74,.45);
  --core-pill-bg:rgba(255,253,248,.55); --core-pill-fg:#5a4418;
  --core-cta-bg:#fffdf8; --core-cta-fg:#6b5120;
  --core-qr-bg:#fffdf8; --core-qr-fg:#8a6a2c;
}
[data-skin="silver"]{
  --page:linear-gradient(165deg,#fbfcfd 0%,#eef1f4 55%,#e0e5eb 100%);
  --bg:#f3f5f8; --surface:#fdfdfe; --surface-2:#e6eaef; --ink:#2b3340; --muted:#5d6775; --faint:#8b94a1;
  --line:rgba(43,51,64,.10); --line-strong:rgba(43,51,64,.20);
  --accent:#4a6282; --accent-hover:#3f5571; --on-accent:#f7f9fc; --accent-soft:#e3e9f1; --accent-ink:#3f5673;
  --btn-bg:linear-gradient(135deg,#6680a2,#44597a); --btn-bg-hover:linear-gradient(135deg,#5b7596,#3c506e);
  --shadow:0 1px 2px rgba(43,51,64,.05),0 12px 32px rgba(43,51,64,.10);
  --phone:#c4cad3; --tint-p:var(--muted);
  --core-bg:linear-gradient(140deg,#fdfdfe 0%,#e4e9ef 48%,#c5cdd8 100%); --core-fg:#2b3340; --core-line:rgba(43,51,64,.16);
  --core-pill-bg:rgba(253,253,254,.65); --core-pill-fg:#3f5673;
  --core-cta-bg:#44597a; --core-cta-fg:#f7f9fc;
  --core-qr-bg:#fdfdfe; --core-qr-fg:#4a6282;
}
[data-skin="sky"]{
  --page:linear-gradient(165deg,#f8fbff 0%,#e9f2fb 55%,#dbe8f5 100%);
  --bg:#f0f6fc; --surface:#fdfeff; --surface-2:#dfeaf5; --ink:#1f3350; --muted:#52657f; --faint:#8395ab;
  --line:rgba(31,51,80,.10); --line-strong:rgba(31,51,80,.20);
  --accent:#2f6fb5; --accent-hover:#285fa0; --on-accent:#f5faff; --accent-soft:#dceaf8; --accent-ink:#235a96;
  --btn-bg:linear-gradient(135deg,#4d8fd6,#2f6fb5); --btn-bg-hover:linear-gradient(135deg,#4384cb,#285fa0);
  --shadow:0 1px 2px rgba(31,51,80,.05),0 12px 32px rgba(31,51,80,.10);
  --phone:#bcd0e6; --tint-p:var(--muted);
  --core-bg:linear-gradient(140deg,#62a2e4 0%,#3b7cc6 58%,#2c66ac 100%); --core-fg:#f5faff; --core-line:transparent;
  --core-pill-bg:rgba(245,250,255,.18); --core-pill-fg:#f5faff;
  --core-cta-bg:#f5faff; --core-cta-fg:#2a63a8;
  --core-qr-bg:#f5faff; --core-qr-fg:#2f6fb5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Onest,-apple-system,"Segoe UI",system-ui,sans-serif;background:var(--page) fixed;min-height:100dvh;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ti{line-height:1}

/* Панель макета: инструменты для просмотра, не часть сайта */
.tool{position:sticky;top:0;z-index:30;background:var(--tool);color:var(--on-tool);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 16px;font-size:13px;--seg-line:var(--tool-line);--seg-bg:var(--surface);--seg-fg:var(--accent-ink)}
.tool .badge{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;border-radius:999px;padding:2px 10px;font-size:12px}
.tool .note,.tool .lbl{color:color-mix(in srgb,var(--on-tool) 66%,transparent)}
.tool .sp{flex:1}
.tool .grp{display:inline-flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--seg-line);border-radius:999px;padding:2px}
.seg button{padding:5px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-bg);color:var(--seg-fg);font-weight:600;box-shadow:0 0 0 1px var(--line-strong)}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--tool-line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.tbtn.on{background:var(--surface);color:var(--accent-ink);font-weight:600}
.sw{display:inline-flex;gap:8px;align-items:center}
.sw button{width:24px;height:24px;border-radius:999px;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);border:1px solid var(--tool-line)}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:1520px){.tool .note{display:none}}

/* Сайт */
.site{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100dvh - var(--tool-h,44px));transition:margin .22s var(--ease)}
.rail{position:sticky;top:var(--tool-h,44px);align-self:start;height:calc(100dvh - var(--tool-h,44px));display:flex;flex-direction:column;gap:3px;padding:18px 12px;border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--mark);position:relative;flex:none}
.brand .mark::after{content:"";position:absolute;inset:9px;border-radius:3px;background:var(--bg)}
.brand b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.brand small{font-size:11.5px;color:var(--faint)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-ctl);font-size:14px;color:var(--muted);text-align:left}
.nav .ti{font-size:18px}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.cur{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.nav.core{color:var(--accent-ink);font-weight:600}
.nav .lk{margin-left:auto;font-size:14px;color:var(--faint)}
.rail .grow{flex:1}
.rail hr{border:0;border-top:1px solid var(--line);margin:8px 6px;width:auto}

.main{container:main/inline-size;padding:22px clamp(16px,3vw,40px) 72px;max-width:1240px;width:100%}
@media (prefers-reduced-motion:no-preference){.view.in{animation:in .26s var(--ease)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;min-height:38px}
.back{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);font-size:14px;font-weight:500}
.back:hover{background:var(--surface-2)}
.back:active,.btn:active,.tile:active,.sec:active{transform:scale(.985)}
.path{font-size:13px;color:var(--faint)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.stop{border-color:var(--ink);color:var(--ink);font-weight:500}

.lead{margin-bottom:22px;max-width:900px}
.lead .cap{font-size:12.5px;color:var(--faint);margin-bottom:6px}
.lead h1{font-size:clamp(22px,2.5cqi,30px);line-height:1.2;font-weight:600;letter-spacing:-.012em;text-wrap:balance}

/* Строка запроса: человек пишет или диктует задачу, платформа ищет решение или передаёт задачу команде */
.ask{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);padding:18px 20px 16px;margin-bottom:14px;display:grid;gap:12px}
.ask-h{font-size:16px;font-weight:600}
.ask-bar{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ask-line);border-radius:999px;padding:6px 6px 6px 18px;background:var(--bg)}
.ask-bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ask-bar>.ti{font-size:20px;color:var(--faint)}
.ask-bar input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;padding:8px 4px}
.ask-bar input::placeholder{color:var(--faint)}
.mic{width:40px;height:40px;border-radius:999px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.mic:hover{background:var(--accent-soft);color:var(--accent-ink)}
.ask-eg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--faint)}
.egc{padding:5px 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;color:var(--muted);text-align:left}
.egc:hover{background:var(--surface-2);color:var(--ink)}
.ask-res{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.res-h{font-size:13px;color:var(--muted);font-weight:500}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-ctl);background:var(--bg)}
.res:hover{background:var(--surface-2)}
.res span.t{flex:1;min-width:0}
.res b{display:block;font-size:14.5px;font-weight:600}
.res small{font-size:12.5px;color:var(--faint)}
.res>.ti{color:var(--faint)}
.res-f{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);padding-top:4px}
.sent{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sent>.ti{font-size:24px;color:var(--accent-ink)}
.sent div{flex:1 1 260px}
.sent b{display:block;font-weight:600}
.sent p{font-size:14px;color:var(--muted);margin-top:2px}
.msg{border:1px dashed var(--line-strong);border-radius:var(--r-ctl);padding:12px 14px;display:grid;gap:4px;font-size:14px;background:var(--bg)}
.msg .cap{font-size:12px;color:var(--faint)}
.msg .q{font-weight:500}
.msg p{color:var(--muted)}
.msg p.q{color:var(--ink)}
.reqs{display:grid;gap:8px;max-width:860px}
.req{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface)}
.req .t{flex:1 1 240px;font-weight:500}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 8px}

.hub{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr)}
.hub.n1{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.hub.n0{grid-template-columns:minmax(0,1fr)}
.hub .col{display:grid;gap:14px;grid-auto-rows:1fr}
.rest{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.rest .tile{flex:1 1 230px}
.tile,.sec{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;min-height:150px;transition:transform .18s var(--ease),border-color .18s}
.tile:hover,.sec:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.ico{width:38px;height:38px;border-radius:var(--r-ctl);background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;flex:none}
.tile h3,.sec h3{font-size:16px;font-weight:600;line-height:1.25;margin-top:4px}
.tile p,.sec p{font-size:13.5px;color:var(--muted);line-height:1.45}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;font-size:12.5px;color:var(--faint)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.tile.tint{background:var(--accent-soft);border-color:transparent}
.tile.tint .ico{background:var(--surface)}
.tile.tint p{color:var(--tint-p)}
.tile.locked,.sec.locked{background:var(--surface-2);border-style:dashed;border-color:var(--line-strong)}
.tile.locked .ico{background:var(--surface);color:var(--faint)}
.tile.locked h3,.sec.locked h3{color:var(--muted)}
.sec.locked .tag{background:var(--surface)}

.tile.core{background:var(--core-bg);color:var(--core-fg);border-color:var(--core-line);padding:26px;min-height:360px;position:relative;overflow:hidden;gap:10px}
.tile.core:hover{border-color:var(--core-line)}
.core .head{min-height:112px}
.core .pill{display:inline-flex;align-items:center;gap:6px;background:var(--core-pill-bg);color:var(--core-pill-fg);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}
.core h2{font-size:clamp(28px,4.2cqi,40px);line-height:1.05;font-weight:700;letter-spacing:-.02em}
.core p{color:color-mix(in srgb,var(--core-fg) 80%,transparent);font-size:14.5px;max-width:36ch}
.stats{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-top:auto;padding-top:14px}
.stats b{display:block;font-size:28px;font-weight:600;line-height:1}
.stats small{font-size:12.5px;color:color-mix(in srgb,currentColor 76%,transparent)}
.eg{font-size:11px;border:1px dashed currentColor;border-radius:999px;padding:1px 8px;align-self:center;color:color-mix(in srgb,currentColor 76%,transparent)}
.cta{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--core-cta-bg);color:var(--core-cta-fg);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;margin-top:10px}
.qr{position:absolute;right:24px;top:24px;width:112px;height:112px;display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(13,1fr);gap:1px;padding:9px;background:var(--core-qr-bg);border:1px solid var(--core-qr-line);border-radius:var(--r-card)}
.qr .f{background:var(--core-qr-fg);border-radius:1px}
.tile.core.locked{background:var(--surface-2);color:var(--ink);border:1px dashed var(--line-strong)}
.core.locked p{color:var(--muted)}
.core.locked .pill{background:var(--surface);color:var(--ink)}
.core.locked .qr{background:var(--surface);border-color:transparent}
.core.locked .qr .f{background:var(--faint)}
.core.locked .cta{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-strong)}

.week{margin-top:30px}
.week h2{font-size:15px;font-weight:600;margin-bottom:8px}
.week-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));border-top:1px solid var(--line)}
.wk{display:flex;align-items:center;gap:12px;padding:14px 6px;text-align:left;border-radius:var(--r-ctl)}
.wk:hover{background:var(--surface)}
.wk .ti{font-size:20px;color:var(--accent-ink)}
.wk b{display:block;font-size:14px;font-weight:500}
.wk small{font-size:12.5px;color:var(--faint)}

.bhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.bhead .big{width:56px;height:56px;border-radius:var(--r-card);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:28px;flex:none}
.bhead h1{font-size:clamp(24px,3.2cqi,34px);line-height:1.1;font-weight:700;letter-spacing:-.02em}
.bhead p{margin-top:6px;color:var(--muted);max-width:62ch}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bhead .tags{margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.a{background:var(--accent-soft);color:var(--accent-ink)}
.tag.dash{background:none;border:1px dashed var(--line-strong)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.sec{min-height:140px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.phonebox{position:sticky;top:calc(var(--tool-h,44px) + 16px);display:grid;gap:10px;justify-items:center}
.phonebox small{font-size:12.5px;color:var(--faint);text-align:center;max-width:30ch}
.phone{width:280px;border-radius:38px;border:9px solid var(--phone);background:var(--surface);padding:16px 12px 20px;display:flex;flex-direction:column;gap:8px;min-height:470px}
.phone .hdr{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.phone .hdr .ico{width:30px;height:30px;font-size:16px}
.bub{max-width:88%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4;background:var(--surface-2);align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.sys{align-self:center;font-size:11.5px;color:var(--faint);padding:2px 0}
.kb{display:grid;gap:6px}
.kb span{border:1px solid var(--line-strong);border-radius:var(--r-ctl);padding:7px;text-align:center;font-size:13px;font-weight:500}

.notice{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 18px;border-radius:var(--r-card);border:1px solid var(--line-strong);background:var(--surface);margin-bottom:18px}
.notice>.ti{font-size:24px}
.notice div{flex:1 1 280px}
.notice b{display:block;font-weight:600}
.notice p{margin-top:2px;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--btn-bg);color:var(--on-accent);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--btn-bg-hover)}
.btn.ghost{background:none;border:1px solid var(--line-strong);color:var(--ink);font-weight:500}
.btn.ghost:hover{background:var(--surface-2)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-card);padding:36px 20px;text-align:center;color:var(--muted)}
.empty .ti{font-size:30px;display:block;margin-bottom:8px;color:var(--faint)}

.item{max-width:860px;display:grid;gap:18px}
.item h1{font-size:clamp(22px,3cqi,30px);line-height:1.15;font-weight:700;letter-spacing:-.015em;margin-top:8px}
.item .d{color:var(--muted);margin-top:6px;max-width:62ch}
.ph{border-radius:var(--r-card);border:1px dashed var(--line-strong);background:repeating-linear-gradient(135deg,transparent 0 13px,var(--line) 13px 14px);min-height:250px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px;font-size:14px}
.ph .ti{font-size:36px;display:block;margin:0 auto 8px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.metric b{display:block;font-size:28px;font-weight:600;line-height:1.1}
.metric small{color:var(--muted);font-size:13px}
.rows{display:grid;gap:8px}
.rowsk{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface)}
.rowsk .ti{font-size:18px;color:var(--faint)}
.sk{height:10px;border-radius:5px;background:var(--surface-2);flex:1}
.sk.s{flex:0 0 22%}
.will h2{font-size:15px;font-weight:600;margin-bottom:8px}
.will ul{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:grid;gap:8px;align-content:start}
.card h2{font-size:15px;font-weight:600}
.card .price{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.card ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.card p{color:var(--muted);font-size:14px}

/* Конструктор */
.panel{position:fixed;top:var(--tool-h,44px);right:0;bottom:0;width:min(var(--panel-w),100vw);background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);transform:translateX(104%);transition:transform .24s var(--ease);overflow:auto;z-index:20;padding:18px 18px 40px;--seg-line:var(--line-strong);--seg-bg:var(--accent-soft);--seg-fg:var(--accent-ink)}
body.panel-open .panel{transform:none}
@media (min-width:1100px){body.panel-open .site{margin-right:var(--panel-w)}}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h3{font-size:18px;font-weight:700}
.panel h4{font-size:13px;color:var(--muted);font-weight:500;margin:20px 0 8px}
.panel .hint{font-size:12.5px;color:var(--faint);margin-top:6px;line-height:1.45}
.skins{display:grid;gap:6px}
.skin{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-ctl);border:1px solid var(--line);font-size:14px}
.skin:hover{background:var(--surface-2)}
.skin[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:500}
.skin i.dot{width:22px;height:22px;border-radius:999px;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);border:1px solid var(--line-strong);flex:none}
.skin small{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.panel .mtext{font-size:13.5px;color:var(--muted);margin-top:8px;padding:10px 12px;border-radius:var(--r-ctl);background:var(--surface-2)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.brow .nm{display:flex;gap:8px;align-items:center;font-size:14px;min-width:0}
.brow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm .ti{font-size:17px;color:var(--faint);flex:none}
.brow.off .nm span{color:var(--faint);text-decoration:line-through}
.brow .fix{font-size:12px;color:var(--faint);min-width:92px;text-align:right;padding-right:6px}
.acc,.ops{display:inline-flex;gap:4px}
.acc button{width:28px;height:28px;border-radius:var(--r-ctl);border:1px solid var(--line-strong);font-size:12px;font-weight:600;color:var(--faint)}
.acc button[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.mini{width:28px;height:28px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--muted);font-size:16px}
.mini:hover{background:var(--surface-2);color:var(--ink)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.addrow input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:var(--bg);color:var(--ink)}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:40;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@container main (min-width:620px){.sec.wide{grid-column:span 2}}
@container main (max-width:860px){
  .hub,.hub.n1{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hub .core{grid-column:1/-1;order:-1;min-height:320px}
  .split{grid-template-columns:minmax(0,1fr)}
  .phonebox{position:static}
}
@container main (max-width:540px){
  .hub,.hub.n1{grid-template-columns:minmax(0,1fr)}
  .bhead .big{width:44px;height:44px;font-size:22px}
  .ask{padding:14px}
  .ask-bar{padding-left:14px}
  .ask-bar .btn span{display:none}
  .ask-bar .btn{padding:11px 13px}
  /* на узком экране плитки блоков становятся компактными строками: значок слева, текст справа */
  .tile:not(.core){display:grid;grid-template-columns:38px minmax(0,1fr);column-gap:12px;row-gap:2px;min-height:0;padding:14px}
  .tile:not(.core) .ico{grid-row:1/4}
  .tile:not(.core) h3{margin-top:0}
  .tile:not(.core) .meta{padding-top:2px}
  .hub,.rest{gap:10px}
  .hub .col{gap:10px}
  .rest{margin-top:10px}
  .rest .tile{flex:1 1 100%}
  .sec{min-height:0}
  .tile.core{padding:20px;min-height:0}
  .core .head{min-height:92px}
  .qr{right:18px;top:18px;width:92px;height:92px;padding:7px}
  .lead{margin-bottom:16px}
}
/* Замечания: кнопка на каждом экране, список копируется одним текстом */
.only-m{display:none}
.tabbar{display:none}
.fab{position:fixed;right:18px;bottom:18px;z-index:35;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:var(--surface);color:var(--accent-ink);border:1px solid var(--line-strong);box-shadow:var(--shadow);font-weight:600;font-size:14px}
.fab .ti{font-size:18px}
.fab .cnt{font-size:12px;background:var(--accent-soft);border-radius:999px;padding:1px 8px}
@media (min-width:1100px){body.panel-open .fab{right:calc(var(--panel-w) + 18px)}body.panel-open .sheet{right:calc(var(--panel-w) + 18px)}}
.sheet{position:fixed;right:18px;bottom:74px;width:min(400px,calc(100vw - 24px));max-height:min(70dvh,560px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px;z-index:45;display:none;gap:10px}
body.note-open .sheet{display:grid}
.sheet h3{font-size:16px;font-weight:700}
.sheet .where{font-size:12.5px;color:var(--faint)}
.sheet label{font-size:13px;color:var(--muted)}
.sheet textarea{font:inherit;font-size:16px;width:100%;min-height:88px;padding:10px 12px;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);resize:vertical}
.sheet .hint{font-size:12.5px;color:var(--faint);line-height:1.45}
.nt{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.nt div{flex:1;min-width:0}
.nt small{display:block;color:var(--faint);font-size:12px}

/* Телефон: одна строка макета сверху, сайт на весь экран, нижняя панель под большой палец */
@media (max-width:900px){
  .only-m{display:block}
  .site{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tool{position:static;flex-wrap:nowrap;justify-content:space-between;gap:8px}
  .tool .note,.tool .sp,.tool .grp{display:none}
  .seg button{padding:6px 9px;font-size:12px}
  .main{padding-top:16px;padding-bottom:160px}
  .topline{margin-bottom:14px;min-height:0}
  .chips{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line-strong);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tab{display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:var(--r-ctl);font-size:11.5px;color:var(--muted);position:relative}
  .tab .ti{font-size:22px}
  .tab.cur{color:var(--accent-ink);font-weight:600}
  .tab .cnt{position:absolute;top:2px;left:calc(50% + 8px);font-size:10.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:0 6px}
  .panel{top:0;width:100vw;z-index:50;padding-bottom:60px}
  .fab{right:12px;bottom:calc(76px + env(safe-area-inset-bottom));padding:10px 14px}
  .sheet{left:12px;right:12px;width:auto;bottom:calc(130px + env(safe-area-inset-bottom));max-height:60dvh}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .mini,.acc button{width:34px;height:34px}
  .addrow input{font-size:16px}
  .ask-eg{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .ask-eg::-webkit-scrollbar{display:none}
  .ask-eg span,.egc{flex:none}
}

/* ===== v2: маршрут новичка, города и точки, партнёрская программа, рынок сделок, профиль, цифровые сотрудники ===== */
:root{--warn:#b4531f;--warn-soft:#fbe7d8}
.main{--seg-line:var(--line-strong);--seg-bg:var(--accent-soft);--seg-fg:var(--accent-ink)}
.h2{font-size:16px;font-weight:600;margin:26px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 10px;max-width:72ch}
.btn.big{padding:12px 20px;font-size:15px}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.bd{font-size:15px;color:var(--accent-ink);margin-left:4px;vertical-align:-2px}

/* строка "что здесь сделать" с одной главной кнопкой */
.do{display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap;padding:18px 20px;border-radius:var(--r-card);background:var(--accent-soft);margin-bottom:16px}
.do .t{flex:1 1 300px}
.do .t>b{display:block;font-size:17px;font-weight:600;line-height:1.3}
.do .t>p{font-size:14px;color:var(--tint-p);margin-top:3px;max-width:70ch}
.do.w{background:var(--warn-soft)}
.do.w .t>p{color:var(--muted)}

/* варианты "либо так, либо так" прямо в тексте раздела */
.vrs{display:grid;gap:8px;margin:0 0 16px}
.vr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13.5px;color:var(--muted);padding:8px 12px;border:1px dashed var(--line-strong);border-radius:var(--r-ctl)}
.vr .vl{font-weight:500;color:var(--ink);margin-right:2px}
.vr .sl{color:var(--faint)}
.vr button{padding:2px 9px;border-radius:999px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px}
.vr button:hover{color:var(--ink)}
.vr button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;text-decoration:none}
.vr .tag{margin-left:4px}
.vr input[type=range]{width:140px;flex:none}
.vr.foot{margin-top:30px}
/* ползунок: светлая дорожка, заполненная часть цветом акцента (--p задаётся в разметке и при движении) */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:26px;width:100%;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--surface-2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-7px;border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.22)}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--surface-2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:999px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}

/* вкладки внутри раздела */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:inline-flex;gap:7px;align-items:center;padding:10px 14px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.cur{color:var(--ink);font-weight:600;border-color:var(--accent)}

/* маршрут новичка */
.route{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-card);padding:18px 20px;margin-bottom:14px;display:grid;gap:14px}
.route-h{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.route-h b{font-size:16px;font-weight:600}
.route-h .n{font-size:13px;color:var(--muted)}
.route-h>.ti{font-size:22px;color:var(--accent-ink)}
.bar{display:block;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:1 1 140px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);width:var(--w)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.step{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--bg);font-size:13.5px;line-height:1.35}
.step:hover{border-color:var(--line-strong)}
.step .num{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted);flex:none}
.step b{font-weight:600;display:block}
.step small{color:var(--faint);font-size:12.5px}
.step.done b{color:var(--muted);font-weight:500}
.step.done .num{background:var(--accent-soft);color:var(--accent-ink)}
.step.next{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.step.next .num{background:var(--accent);color:var(--on-accent)}
.steps.v3{grid-template-columns:minmax(0,1fr);max-width:760px}
.steps.v3 .step{flex-direction:row;align-items:center}

/* масштаб сети на главной */
.net{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:flex-end;width:100%;text-align:left;padding:14px 20px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);margin-bottom:14px}
.net:hover{border-color:var(--line-strong)}
.net .h{flex:1 1 100%;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.net .k b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.net .k small{font-size:12.5px;color:var(--muted)}
.net .go{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--accent-ink)}

/* точки города */
.cityg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.pts{display:grid;gap:8px}
.pt{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);text-align:left;width:100%}
.pt .ico{width:34px;height:34px;font-size:18px}
.pt .t{flex:1;min-width:0}
.pt b{display:block;font-size:14.5px;font-weight:600}
.pt small{font-size:12.5px;color:var(--faint)}
.pt.free{border-style:dashed;border-color:var(--accent)}
.pt.taken .ico{background:var(--surface-2);color:var(--faint)}
.pt.mine{border-color:var(--accent);background:var(--accent-soft)}
.pt.mine .ico{background:var(--surface)}
.pt.sel{box-shadow:0 0 0 3px var(--accent-soft)}
.pt.wait .ico{background:var(--warn-soft);color:var(--warn)}
.cmap{position:sticky;top:calc(var(--tool-h,44px) + 16px)}
.cmap .box{position:relative;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface);overflow:hidden;aspect-ratio:6/4.4}
.cmap svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-size:18px;border:2px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.pin.taken{background:var(--surface-2);color:var(--faint)}
.pin.free{background:var(--surface);color:var(--accent-ink);border:2px dashed var(--accent)}
.pin.mine{background:var(--accent);color:var(--on-accent)}
.pin.sel{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i.d{display:inline-block;width:12px;height:12px;border-radius:999px;margin-right:6px;vertical-align:-1px;border:1.5px solid transparent}
.sign{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px;border:1px solid var(--line-strong);border-radius:var(--r-card);background:var(--surface);margin-bottom:16px;max-width:520px}
.sign b{display:block;font-size:16px;font-weight:600;line-height:1.3;margin:2px 0}
.sign small{font-size:12.5px;color:var(--faint);display:block}
.sign>div:last-child{flex:1 1 200px}
.qr.inl{position:static;flex:none;width:104px;height:104px;padding:8px;background:var(--surface);border:1px solid var(--line-strong)}
.qr.inl .f{background:var(--ink)}

/* карта России: только точки городов, без границ */
.rcols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.9fr);gap:22px;align-items:start}
.rk.c .rkr{grid-template-columns:22px minmax(0,1fr) 72px 44px}
.rscroll{overflow-x:auto;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface)}
.rmap{position:relative;aspect-ratio:2.25/1;min-width:760px;background:radial-gradient(120% 90% at 50% -30%,transparent 60%,var(--surface-2) 61%,transparent 62%),radial-gradient(150% 120% at 50% -30%,transparent 60%,var(--surface-2) 60.6%,transparent 61.4%),radial-gradient(180% 150% at 50% -30%,transparent 60%,var(--surface-2) 60.5%,transparent 61%)}
.cdot{position:absolute;transform:translate(-50%,-50%);border-radius:999px;display:grid;place-items:center;font-size:10.5px;font-weight:600;line-height:1}
.cdot.on{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.cdot.my{outline:2px solid var(--ink);outline-offset:3px}
.cdot.wait{background:var(--warn);color:#fff;font-size:13px;box-shadow:0 0 0 5px color-mix(in srgb,var(--warn) 24%,transparent)}
.cdot.emp{background:var(--surface);border:1.5px dashed var(--faint)}
.cdot.sel{outline:3px solid var(--accent);outline-offset:3px;z-index:2}
@media (prefers-reduced-motion:no-preference){.cdot.wait{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--warn) 8%,transparent)}}
.clab{position:absolute;font-size:11.5px;font-weight:500;white-space:nowrap;pointer-events:none;color:var(--ink)}
.clab.b{transform:translate(-50%,var(--o))}
.clab.t{transform:translate(-50%,calc(-100% - var(--o)))}

function findStaff(q){q=q.toLowerCase();for(var i=0;i<STAFFKEY.length;i++)if(STAFFKEY[i][0].test(q))return STAFFKEY[i][1];return -1}
var STOP=['клиент','клиента','клиенту','клиенты','клиентов','агент','агента','агенту','хочу','нужен','нужна','нужно','надо','чтобы','какой','такой','такую','сделать','можно','было','очень','меня','свой','своя','хотелось','провели','провести','лекцию','лекция','лекции','спикер','спикера','эфир'];

function findTools(q){
  var w=q.toLowerCase().split(/[^a-zа-яё0-9]+/).filter(function(x){return x.length>=4&&STOP.indexOf(x)<0}).map(function(x){return x.slice(0,5)});
  if(!w.length)return [];
  var need=Math.max(1,Math.ceil(w.length*0.6)),res=[];
  [get('club')].concat(shown()).forEach(function(b){b.sections.forEach(function(s,i){
    var hay=(b.title+' '+s.t+' '+s.d).toLowerCase(),score=w.filter(function(x){return hay.indexOf(x)>-1}).length;
    if(score>=need)res.push({b:b,s:s,i:i,score:score});
  })});
  return res.sort(function(a,c){return c.score-a.score}).slice(0,4);
}

  var res=findTools(q),st=res.length?-1:findStaff(q);

  ASK={q:q,type:reqType(q),res:res,staff:st,sent:!res.length&&st<0};
  if(ASK.sent)addReq(q);

}

function route(){

  if(p[0]==='account')return {v:'account'};
  if(p[0]==='requests')return {v:'requests'};
  if(p[0]==='profile')return {v:'profile',pid:p[1]&&agent(p[1])?p[1]:'me'};
  if(p[0]==='anketa'||p[0]==='course'||p[0]==='verify')return {v:p[0]};
  if(p[0]==='b'){var b=get(p[1]);
    if(b&&S.off.indexOf(b.id)<0){
      if(b.page)return {v:'block',id:b.id,sub:decodeURIComponent(p[2]||'')};
      var n=parseInt(p[2],10);
      if(!isNaN(n)&&b.sections[n]&&!lock(b.id)&&!secLock(b.sections[n]))return {v:'item',id:b.id,n:n};
      return {v:'block',id:b.id};
    }}
  return {v:'home'};
}
function lock(id){if(!S.paid)return 'pay';if(!S.acc[id][S.role])return 'level';return ''}

function qr(cls){
  var N=13,c=[[0,0],[N-4,0],[0,N-4]],s=11,h='';
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var on,F=null;
    c.forEach(function(p){if(x>=p[0]-1&&x<=p[0]+4&&y>=p[1]-1&&y<=p[1]+4)F=p});
    if(F){var inside=x>=F[0]&&x<F[0]+4&&y>=F[1]&&y<F[1]+4;on=inside&&(x===F[0]||x===F[0]+3||y===F[1]||y===F[1]+3)}
    else{s=(s*1103515245+12345)&0x7fffffff;on=(s>>16)%2===0}
    h+='<span'+(on?' class="f"':'')+'></span>';
  }
  return '<div class="qr'+(cls?' '+cls:'')+'" aria-hidden="true">'+h+'</div>';
}

function payLine(sum,P){

  if(S.pay==='money')return 'Выплата деньгами. Свою подписку '+rub(P)+' вы оплачиваете отдельно.';
  return sum>P?'Подписка бесплатна, сверх этого '+rub(sum-P)+' выплачивается деньгами.':'Засчитано в счёт подписки: доплата '+rub(P-sum)+'. Деньгами выплачивается всё, что выше '+rub(P)+'.';

function tDead(t){
  if(S.pterm==='none')return null;
  var base=t.log[0][0];
  if(S.pterm==='90')t.log.forEach(function(e){if(PSI[e[2]]>0)base=e[0]});
  var d=pd(base);d.setDate(d.getDate()+(S.pterm==='90'?90:180));return d;
}
function tSt(t){
  var st='wait';
  t.log.forEach(function(e){var c=e[2];if(c==='new')st='wait';else if(c==='no')st='noc';else if(PST[c])st=c});
  if(st==='noc')return S.pnoc==='drop'?'drop':'noc';
  var d=tDead(t);
  if(d&&d<TODAY&&st!=='done'&&st!=='fail')return 'exp';
  return st;
}
function tGrp(st){return st==='done'?'done':(st==='fail'||st==='exp')?'bad':st==='drop'?'drop':'work'}
function pStat(pid,per){
  var r={tot:0,done:0,work:0,bad:0};
  allT().forEach(function(t){if(pid&&t.p!==pid)return;var g=tGrp(tSt(t));if(g==='drop')return;r.tot++;r[g]++});
  if(per==='all')(pid?[pp(pid)]:allPP()).forEach(function(p){r.tot+=p.old[0];r.done+=p.old[1];r.bad+=p.old[2]});
  return r;
}

function tSteps(t){
  var st=tSt(t),reach=0,noc=st==='noc'||st==='drop',fin=st==='done',bad=st==='fail'||st==='exp',ok=tHas(t,'yes');
  t.log.forEach(function(e){var i=PSI[e[2]];if(i>reach&&i<4)reach=i});
  var chips=[[ok?'Клиент подтвердил':noc?PST[st]:'Ждёт клиента',noc?'bad':'on',ok]];
  ['Принял','Связался','Договор'].forEach(function(n,i){chips.push([n,i+1<=reach?'on':'',i+1<=reach])});
  chips.push([fin?'Выполнено':bad?PST[st]:'Выполнено или не состоялось',fin?'on':bad?'bad':'',fin]);
  return '<div class="stp">'+chips.map(function(c,i){return (i?ic('chevron-right'):'')+'<span class="'+c[1]+'">'+(c[2]?ic('check'):'')+c[0]+'</span>'}).join('')+'</div>';
}

  if(c==='ansyes'&&t.rate)x+=' и поставил оценку '+t.rate+' из 5';

}

}

function partnersPage(sub){
  var t=ptBy(sub);
  if(t)return transferPage(t);
  var tabs=[['','Мои партнёры','heart-handshake'],['send','Передать клиента','send'],['list','Мои передачи','list-check'],['score','Счёт рекомендаций','arrows-left-right'],['view','Глазами партнёра и клиента','device-mobile'],['cat','Каталог','category'],['agency','Партнёры агентства','crown']];
  var cur=tabs.some(function(x){return x[0]===sub})?sub:'';
  var f={send:partnersSend,list:partnersList,score:partnersScore,view:partnersView,cat:partnersCat,agency:partnersAgency}[cur]||partnersMy;
  return tabsHTML('#/b/partners',tabs,cur)+f();
}
var PAGES={cities:citiesPage,deals:dealsPage,invite:invitePage,partners:partnersPage},VIEWS={staff:staffView,dept:deptView};
/* обновление расчётов при движении ползунка без перерисовки страницы */
function upd(what){
  var i,els;
  if(what==='calc'){
    els=document.querySelectorAll('[data-o]');for(i=0;i<els.length;i++)els[i].textContent=clab(els[i].getAttribute('data-o'));
    if($('#calcout'))$('#calcout').innerHTML=calcOut();
    if($('#agex'))$('#agex').innerHTML=agEx();
  }else{
    els=document.querySelectorAll('[data-share]');for(i=0;i<els.length;i++)els[i].textContent=S.share+'%';
    if($('#shareout'))$('#shareout').textContent=shareOut();
  }
}

/* ---------- отрисовка и события ---------- */
var lastKey=null,scrolls={},toastT;
function syncH(){document.documentElement.style.setProperty('--tool-h',$('#tool').offsetHeight+'px')}
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},2600)}
function render(){
  var r=route(),key=location.hash||'#/';
  /* экран "запись создана" показываем, только пока человек не ушёл со вкладки "Передать клиента" */
  if(!(r.v==='block'&&r.id==='partners'&&r.sub==='send'))PLAST='';
  document.documentElement.setAttribute('data-skin',S.skin);
  document.body.classList.toggle('panel-open',!!S.panel);
  $('#tool').innerHTML=toolHTML();
  $('#rail').innerHTML=railHTML(r);
  var view=r.v==='home'?home():r.v==='block'?block(get(r.id),r.sub):r.v==='item'?item(get(r.id),r.n):r.v==='requests'?requests():r.v==='profile'?profile(r.pid):r.v==='anketa'?anketa():r.v==='course'?course():r.v==='verify'?verify():account();
  $('#main').innerHTML='<div class="view'+(key!==lastKey?' in':'')+'">'+top(r)+view+'</div>';
  var pn=$('#panel'),st=pn.scrollTop;pn.innerHTML=panelHTML();pn.scrollTop=st;
  $('#tabbar').innerHTML=tabbarHTML(r);
  document.body.classList.toggle('note-open',NOTE_OPEN);
  $('#fabwrap').innerHTML='<button class="fab" data-act="note">'+ic('message-plus')+'Замечание'+(S.notes.length?'<span class="cnt">'+S.notes.length+'</span>':'')+'</button>';
  $('#sheet').innerHTML=sheetHTML(r);
  syncH();
  if(key!==lastKey){window.scrollTo(0,scrolls[key]||0);lastKey=key}
  /* длинная лента вкладок на телефоне: текущая вкладка всегда в поле зрения */
  var tb=$('.tabs'),ct=$('.tabs .cur');
  if(tb&&ct&&tb.scrollWidth>tb.clientWidth)tb.scrollLeft+=ct.getBoundingClientRect().left-tb.getBoundingClientRect().left-(tb.clientWidth-ct.offsetWidth)/2;
  if(FOCUS){var fe=$('#'+FOCUS);FOCUS='';if(fe){fe.focus();fe.scrollIntoView({block:'center'})}}
}
var FOCUS='';
function move(id,d){var i=S.order.indexOf(id),j=i+d;if(i<0||j<0||j>=S.order.length)return;S.order.splice(i,1);S.order.splice(j,0,id)}
function addBlock(){
  var inp=$('#newname'),name=(inp.value||'').trim();
  if(!name){toast('Введите название блока');inp.focus();return}
  var id='c'+Date.now().toString(36);
  S.custom.push({id:id,title:name});S.order.push(id);S.acc[id]={dir:true,agent:true};
}
function back(){var r=route();if(NOTE_OPEN){NOTE_OPEN=false;render();return}if(S.panel){S.panel=false;save();render();return}if(r.v==='item')location.hash='#/b/'+r.id;else if(r.v==='block'&&r.id==='deals'&&r.sub)location.hash='#/b/deals';else if(r.v==='block'&&r.id==='partners'&&ptBy(r.sub))location.hash='#/b/partners/list';else if(r.v==='anketa'||r.v==='course')location.hash='#/verify';else if(r.v!=='home')location.hash='#/'}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){scrolls[location.hash||'#/']=window.scrollY;FOCUS=g.getAttribute('data-focus')||'';location.hash=g.getAttribute('data-go');return}
  var a=e.target.closest('[data-act]');if(!a)return;
  var p=a.getAttribute('data-act').split(':'),act=p[0],x=p[1],y=p[2];
  if(act==='role')S.role=x;
  /* ---- v2 ---- */
  else if(act==='var')S[x]=(x==='circles'||x==='disc')?+y:y;
  else if(act==='lvl')setLvl(x==='ver');
  else if(act==='mode')S.mode[x]=y;
  else if(act==='take'){if(S.taken.indexOf(x)<0)S.taken.push(x);S.psel=x;S.steps[2]=true;save();render();window.scrollTo(0,0);toast('Точка ваша. Следующий шаг: табличка с QR');return}
  else if(act==='psel')S.psel=S.psel===x?'':x;
  else if(act==='print'){toast('В макете печать не подключена. В рабочей версии откроется табличка для печати');return}
  else if(act==='newpt'){toast('В макете заявка на новую точку не отправляется');return}
  else if(act==='csel')S.csel=S.csel===x?'':x;
  else if(act==='rg')S.rg=x;
  else if(act==='rp')S.rp=x;
  else if(act==='df')S.df=x;
  else if(act==='copylink'){if(!needVer())return;S.steps[3]=true;save();render();copyText(LINK,'Ссылка скопирована. Отправьте её коллеге');return}
  else if(act==='preset'){S.calc.n1=1;S.calc.n2=20;S.circles=2;toast('Подставлен пример: директор и 20 агентов')}
  else if(act==='oc')S.oc=S.oc===x?'':x;
  else if(act==='ocopy'){if(!needVer())return;var od=D.filter(function(d){return d.id===x})[0];S.steps[3]=true;save();render();copyText(ocText(od),'Приглашение скопировано. Отправьте его агентству');return}
  else if(act==='respond'){if(!needVer())return;S.resp[x]=true;S.steps[4]=true;toast('Отклик отправлен автору заявки')}
  else if(act==='takedeal'){if(!needVer())return;S.took[x]=true;S.steps[4]=true;toast('Заявка ваша: статус «В работе»')}
  else if(act==='dealdone'){S.took[x]='deal';toast('Отмечено: сделка')}
  else if(act==='pick'){S.pick[x]=y;toast('Исполнитель выбран: заявка передана')}
  else if(act==='pub'){if(!needVer())return;pubDeal();return}
  else if(act==='ankfill'){fillAnk();toast('Поля заполнены примером')}
  else if(act==='anksend'){fillAnk();S.steps[0]=true;save();toast('Анкета отправлена');location.hash='#/verify';return}
  else if(act==='quiz')S.quiz[+x]=+y;
  else if(act==='quizsend'){if(S.quiz.some(function(q){return q<0})){toast('Ответьте на все три вопроса');return}S.steps[1]=true;save();toast('Курс пройден');location.hash='#/verify';return}
  else if(act==='verok'){S.ver=true;toast('Значок «проверенный агент» получен')}
  else if(act==='feed'){S.feed[x]=y;toast(y==='ok'?'Утверждено: сотрудник выполняет':'Возвращено сотруднику на доработку')}
  else if(act==='feedall'){FEED.forEach(function(f){if(!S.feed[f[0]])S.feed[f[0]]='ok'});toast('Всё утверждено')}
  /* ---- v2: база партнёров ---- */
  else if(act==='padd')S.padd=S.padd===x?'':x;
  else if(act==='pjoin'){if(S.pjoin.indexOf(x)<0)S.pjoin.push(x);S.padd='';toast('Специалист вступил: он появился в вашем списке')}
  else if(act==='pcopy'){copyText(pMsg(x),'Сообщение скопировано. Перешлите его специалисту');return}
  else if(act==='pcopyt'){copyText('platforma.example/t/КОД-ПЕРЕДАЧИ','Ссылка скопирована. Перешлите её клиенту');return}
  else if(act==='pto'){PS.p=x;PLAST='';scrolls[location.hash||'#/']=window.scrollY;if(location.hash==='#/b/partners/send')render();else location.hash='#/b/partners/send';return}
  else if(act==='psrc')PS.src=x;
  else if(act==='psend'){if(!sendClient())return;save();render();window.scrollTo(0,0);toast('Запись создана. Клиенту ушло сообщение');return}
  else if(act==='pmore')PLAST='';
  else if(act==='pnext'){var pt=ptBy(x),pn=pt?tNext(pt):null;if(!pn)return;pt.log.push([TD,nowHM(),pn[0]]);if(pn[0]==='ansyes')pt.rate=5;toast('В макете: '+pn[1])}
  else if(act==='pcopylog'){var pl=ptBy(x);if(pl)copyText(tExtract(pl),'Выписка скопирована');return}
  else if(act==='poffer'){toast('В макете заявка не отправляется. В рабочей версии откроется анкета партнёра');return}
  else if(act==='ptf')S.ptf=x;
  else if(act==='pper')S.pper=x;
  else if(act==='hback'){history.back();return}
  else if(act==='paid')S.paid=x==='1';
  else if(act==='renew'){S.paid=true;toast('В макете подписка снова активна')}
  else if(act==='skin')S.skin=x;
  else if(act==='panel')S.panel=!S.panel;
  else if(act==='mission')S.mission=+x;
  else if(act==='toggle'){var i=S.off.indexOf(x);if(i>-1)S.off.splice(i,1);else S.off.push(x)}
  else if(act==='acc')S.acc[x][y]=!S.acc[x][y];
  else if(act==='up')move(x,-1);
  else if(act==='down')move(x,1);
  else if(act==='add')addBlock();
  else if(act==='del'){S.custom=S.custom.filter(function(c){return c.id!==x});S.order=S.order.filter(function(id){return id!==x});delete S.acc[x]}
  else if(act==='locked'){toast(a.getAttribute('data-msg'));return}
  else if(act==='ask'){if(!doAsk($('#ask').value))return}
  else if(act==='eg'){if(!doAsk(EXAMPLES[+x]))return}
  else if(act==='send'){if(ASK){addReq(ASK.q);ASK.sent=true}}
  else if(act==='mic'){toast('В макете голос не подключён. В рабочей версии здесь запись голоса');return}
  else if(act==='reset'){var keep={skin:S.skin,panel:S.panel};try{localStorage.removeItem(KEY)}catch(err){}S=defaults();S.skin=keep.skin;S.panel=keep.panel;ASK=null;QTXT='';ND={to:'Москва',what:'',bud:'',term:''};PS={src:'my',cl:'c1',name:'',tel:'',p:'',what:''};PLAST='';toast('Макет сброшен к исходному виду')}
  else if(act==='copy'){copyText(summary(),'Сборка скопирована. Отправьте её автору макета');return}
  else if(act==='note')NOTE_OPEN=!NOTE_OPEN;
  else if(act==='notesave'){
    var nt=($('#notetext').value||'').trim();
    if(!nt){toast('Напишите замечание');return}
    S.notes.push({w:screenName(route()),t:nt});NOTE_DRAFT='';toast('Замечание сохранено');
  }
  else if(act==='notedel')S.notes.splice(+x,1);
  else if(act==='notecopy'){copyText(notesText(),'Замечания скопированы. Отправьте их автору макета');return}
  save();render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='newname'){addBlock();save();render()}
  else if(e.key==='Enter'&&e.target.id==='ask'){if(doAsk(e.target.value)){save();render()}}
  else if(e.key==='Escape')back();
});
document.addEventListener('input',function(e){
  var t=e.target,f=t.getAttribute('data-f');
  if(t.id==='ask')QTXT=t.value;
  else if(t.id==='notetext')NOTE_DRAFT=t.value;
  else if(f){
    var p=f.split(':');
    if(t.type==='range')t.style.setProperty('--p',Math.round((t.value-t.min)/(t.max-t.min)*100)+'%');
    if(p[0]==='ank'){S.ank[p[1]]=t.value;save()}
    else if(p[0]==='nd')ND[p[1]]=t.value;
    else if(p[0]==='ps')PS[p[1]]=t.value;
    else if(p[0]==='calc'){S.calc[p[1]]=+t.value;save();upd('calc')}
    else if(p[0]==='share'){S.share=+t.value;save();upd('share')}
  }
});
/* ползунок отпущен: перерисовать всё, что зависит от значения */
document.addEventListener('change',function(e){if(e.target.type==='range')render()});
window.addEventListener('hashchange',render);
window.addEventListener('resize',syncH);
if(PENDING)doAsk(PENDING);
render();
window.__summary=summary;
})();
